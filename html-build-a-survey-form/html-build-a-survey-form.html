<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey</h1>
    <p id="description">This is a flexible survey form.</p>
    <form id="survey-form">
      <label id="name-label">Name:
        <input placeholder="Enter Your Name Here" id="name" type="text" required>
      </label>
      <br>
      <label id="email-label">E-Mail:
        <input placeholder="Enter Your E-mail Here" id="email" type="email" required>
      </label>
      <br>
      <label id="number-label">Age
        <input placeholder="Enter Your Age Here" id="number" type="number" min="18" max="100">
      </label>
      <br>
      <br>
     <label for="dropdown">Enter your current role:</label>
       <br>
      <select id="dropdown" name="role">
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
        <option value="option4">Option 4</option>
      </select>
      <br>
      <br>
      <fieldset> 
        <legend>Enter Your goal role:</legend>
        <input id="goal-role-1" type="radio" name="goal-role" value="option1">
        <label for="goal-role-1">Option 1
        </label>
        <br>
        <input id="goal-role-2" type="radio" name="goal-role" value="option2">
        <label for="goal-role-2">Option 2
        </label>
        <br>
      </fieldset>
      <fieldset>
        <legend>What role is your nightmare role?</legend>
        <input id="option1" type="checkbox" name="nightmare-role" value="option1"><label for="option1">Option 1
        </label>
        <input id="option2" type="checkbox" name="nightmare-role" value="option2"><label for="option2">Option2
        </label>
        <input id="option3" type="checkbox" name="nightmare-role" value="option3"><label for="option3">Option3
        </label>
      </fieldset>
      <label for="additional-comments">Add Additional Comments Down Below:
      </label>
      <br>
      <textarea id="additional-comments" name="add-comments">
      </textarea>
      <button id="submit">Submit</button>
    </form>
</html>
